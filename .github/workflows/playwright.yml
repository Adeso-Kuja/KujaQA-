name: Playwright Tests
on:
  push:
    branches: [ main, master, kujalink_plw ]
  pull_request:
    branches: [ main, master, kujalink_plw ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # 1. Moved ENV here so every step can see the secrets
    env:
      MAILPIT_USERNAME: ${{ secrets.MAILPIT_USERNAME }}
      MAILPIT_PASSWORD: ${{ secrets.MAILPIT_PASSWORD }}
      BASE_URL: https://staging.link.kuja.org/

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npx playwright test --reporter=html,list,github
      
    - name: Add summary
      if: always()
      run: |
        echo "### Test Results 🚀" >> $GITHUB_STEP_SUMMARY
        echo "Detailed report is available in the artifacts below." >> $GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 2