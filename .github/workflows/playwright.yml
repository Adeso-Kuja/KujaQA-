name: Playwright Tests
on:
  push:
    branches: [ main, master, kujalink_plw ]
  pull_request:
    branches: [ main, master, kujalink_plw ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    env:
      MAILPIT_USERNAME: ${{ secrets.MAILPIT_USERNAME }}
      MAILPIT_PASSWORD: ${{ secrets.MAILPIT_PASSWORD }}
      BASE_URL: https://staging.link.kuja.org/

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      # Added --reporter=allure-playwright
      run: npx playwright test --reporter=html,list,github,allure-playwright
      
    - name: Get Allure history
      # This allows Allure to show trend charts over time
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages-dir

    - name: Allure Report Action
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-history
        publish_branch: gh-pages

    - name: Add summary
      if: always()
      run: |
        echo "### Test Results 🚀" >> $GITHUB_STEP_SUMMARY
        echo "✅ Allure Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 2




