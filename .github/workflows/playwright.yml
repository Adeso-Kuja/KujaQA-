name: Playwright Tests
on:
  push:
    branches: [ main, master, kujalink_plw ]
  pull_request:
    branches: [ main, master, kujalink_plw ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    env:
      MAILPIT_USERNAME: ${{ secrets.MAILPIT_USERNAME }}
      MAILPIT_PASSWORD: ${{ secrets.MAILPIT_PASSWORD }}
      BASE_URL: https://staging.link.kuja.org/

    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      # We force the reporter here just to be absolutely sure
      run: npx playwright test --reporter=line,allure-playwright
      continue-on-error: true

    - name: Check for results folder
      run: ls -R allure-results || echo "Folder not found!"

    - name: Load Allure history
      uses: actions/checkout@v4
      if: always()
      with:
        ref: gh-pages
        path: gh-pages-temp # Changed path to avoid conflicts
        
    - name: Build Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        gh_pages: gh-pages-temp # Tell the action where the history was checked out
        keep_reports: 20

    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-history
        publish_branch: gh-pages
        enable_jekyll: false 

    - name: Add summary
      if: always()
      run: |
        echo "### Test Results 🚀" >> $GITHUB_STEP_SUMMARY
        echo "✅ Allure Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 2
