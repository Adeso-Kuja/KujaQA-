name: Playwright Tests
on:
  push:
    branches: [ main, master, kujalink_plw ]
  pull_request:
    branches: [ main, master, kujalink_plw ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    env:
      MAILPIT_USERNAME: ${{ secrets.MAILPIT_USERNAME }}
      MAILPIT_PASSWORD: ${{ secrets.MAILPIT_PASSWORD }}
      BASE_URL: https://staging.link.kuja.org/

    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      # We use your config's reporters but ensure allure-results are generated
      run: npx playwright test
      continue-on-error: true

    - name: Load Allure history
      uses: actions/checkout@v4
      if: always()
      with:
        ref: gh-pages
        path: gh-pages
        
    - name: Build Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        # Deploy 'allure-history' because simple-elf puts the full report there
        publish_dir: ./allure-history
        publish_branch: gh-pages
        # Crucial: prevents GitHub from ignoring folders starting with underscores
        enable_jekyll: false 

    - name: Add summary
      if: always()
      run: |
        echo "### Test Results 🚀" >> $GITHUB_STEP_SUMMARY
        echo "✅ Allure Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 2














